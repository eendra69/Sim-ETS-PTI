services:
  postgres:
    image: postgres:16-alpine
    container_name: sim-ets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sim_ets}
      POSTGRES_USER: ${POSTGRES_USER:-sim_ets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sim_ets_dev}
    ports:
      - "5432:5432"
    volumes:
      - sim_ets_postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_position_balance.sql:/docker-entrypoint-initdb.d/10-position-balance.sql:ro
      - ./database/migrations/002_limit_orders.sql:/docker-entrypoint-initdb.d/15-limit-orders.sql:ro
      - ./database/migrations/003_matching_engine.sql:/docker-entrypoint-initdb.d/17-matching-engine.sql:ro
      - ./database/migrations/004_market_orders.sql:/docker-entrypoint-initdb.d/18-market-orders.sql:ro
      - ./database/migrations/005_stop_trigger_book.sql:/docker-entrypoint-initdb.d/19-stop-trigger-book.sql:ro
      - ./database/migrations/006_trade_market_data.sql:/docker-entrypoint-initdb.d/19-trade-market-data.sql:ro
      - ./database/migrations/007_settlement_sruk.sql:/docker-entrypoint-initdb.d/19-z-settlement-sruk.sql:ro
      - ./database/seeds/001_demo_participants.sql:/docker-entrypoint-initdb.d/20-demo-participants.sql:ro
      - ./database/migrations/008_ruleset_admin_audit.sql:/docker-entrypoint-initdb.d/21-ruleset-admin-audit.sql:ro
      - ./database/seeds/002_governance.sql:/docker-entrypoint-initdb.d/22-governance.sql:ro
      - ./database/migrations/009_compliance_data_provenance.sql:/docker-entrypoint-initdb.d/23-compliance-data-provenance.sql:ro
      - ./database/seeds/003_synthetic_compliance_2024_2026.sql:/docker-entrypoint-initdb.d/24-synthetic-compliance.sql:ro
      - ./database/migrations/010_vintage_installation_catalog.sql:/docker-entrypoint-initdb.d/25-vintage-installation-catalog.sql:ro
      - ./database/seeds/004_vintage_installation_2024_2027.sql:/docker-entrypoint-initdb.d/26-vintage-installation-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sim_ets} -d ${POSTGRES_DB:-sim_ets}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sim_ets_postgres_data:
